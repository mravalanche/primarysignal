name: primary-signal-dev

services:
  database:
    image: postgres:18.6
    restart: unless-stopped
    env_file:
      - path: .env.database
        required: true
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - database-data:/var/lib/postgresql
      - ./deploy/postgres/initdb/010_queue_capability_roles.sql:/docker-entrypoint-initdb.d/010_queue_capability_roles.sql:ro
      - ./deploy/postgres/initdb/020_feed_scheduler_capability_role.sql:/docker-entrypoint-initdb.d/020_feed_scheduler_capability_role.sql:ro
      - ./deploy/postgres/initdb/030_feed_poll_capability_role.sql:/docker-entrypoint-initdb.d/030_feed_poll_capability_role.sql:ro
    networks:
      - application

networks:
  application:
    internal: true

volumes:
  database-data:

secrets:
  database_password:
    file: .secrets/database_password
