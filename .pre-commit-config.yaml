repos:
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect leaked secrets
        entry: uv run --offline --locked python -m detect_secrets.pre_commit_hook --no-verify -c 1 --baseline .secrets.baseline
        language: system
        pass_filenames: true
      - id: primary-signal-quality
        name: Primary Signal offline quality gate
        entry: uv run --offline --locked poe check-offline
        language: system
        pass_filenames: false
