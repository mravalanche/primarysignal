{% extends "layouts/base.html" %}
{% block styles %}
  <script>
    (() => {
      try {
        const theme = localStorage.getItem("primary-signal-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = `primarysignal-${theme}`;
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('public-assets', path='/public.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('public-assets', path='/brand/favicon.svg') }}" data-light-icon="{{ url_for('public-assets', path='/brand/favicon-light.svg') }}" data-dark-icon="{{ url_for('public-assets', path='/brand/favicon-dark.svg') }}">
{% endblock %}
{% block body %}
  <header class="ps-masthead border-b ps-rule">
    <div class="ps-page flex min-h-16 items-center justify-between gap-4">
      <a href="/" class="ps-brand">
        <svg class="ps-brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 55V48l4-6 4 6 4-12 4 11 2-6v14zM49 55V44l3-8 3 10 3-6 1 7v8z" style="fill:var(--ps-logo-ink)"/>
          <path d="M5 57h54" style="stroke:var(--ps-logo-ink)" stroke-width="3"/>
          <defs>
            <mask id="ps-brand-p-counter" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
              <path d="M0 0h64v64H0z" fill="white"/>
              <path d="M32 30h4c3 0 5 2 5 5s-2 5-5 5h-4z" fill="black"/>
            </mask>
            <mask id="ps-brand-floor-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
              <path d="M0 0h64v64H0z" fill="white"/>
              <path d="M40 56 43 49 47 56z" fill="black"/>
            </mask>
          </defs>
          <path d="M25 55V23h11c8 0 12 5 12 12s-4 12-12 12h-4v8z" style="fill:var(--ps-logo-accent)" mask="url(#ps-brand-p-counter)"/>
          <path d="M33 55v-3l3-2 3 3 3-6 3 5 4-1v4z" style="fill:var(--ps-logo-ink)" mask="url(#ps-brand-floor-cut)"/>
        </svg>
        <span class="ps-brand-name">Primary Signal</span>
      </a>
      <div class="flex items-center gap-3">
        {% block masthead_context %}<span class="ps-preview-label">Component catalogue</span>{% endblock %}
        <button class="ps-theme-toggle" type="button" aria-label="Switch colour theme" aria-pressed="false" data-theme-toggle>Theme</button>
      </div>
    </div>
  </header>
  <main id="main-content" class="ps-page py-10">{% block content %}{% endblock %}</main>
  <script>
    (() => {
      const button = document.querySelector("[data-theme-toggle]");
      if (!button) return;
      const preferredDark = () => matchMedia("(prefers-color-scheme: dark)").matches;
      const current = () => document.documentElement.dataset.theme || (preferredDark() ? "primarysignal-dark" : "primarysignal-light");
      const update = () => {
        const dark = current() === "primarysignal-dark";
        button.setAttribute("aria-pressed", String(dark));
        button.textContent = dark ? "Light" : "Dark";
        const icon = document.querySelector('link[rel="icon"]');
        if (icon) icon.href = dark ? icon.dataset.darkIcon : icon.dataset.lightIcon;
      };
      button.addEventListener("click", () => {
        const next = current() === "primarysignal-dark" ? "light" : "dark";
        document.documentElement.dataset.theme = `primarysignal-${next}`;
        try { localStorage.setItem("primary-signal-theme", next); } catch (_) {}
        update();
      });
      update();
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", update);

      document.querySelectorAll("[data-source-toggle]").forEach((link) => {
        link.addEventListener("click", () => {
          const target = document.querySelector(link.getAttribute("href"));
          if (target instanceof HTMLDetailsElement) target.open = true;
        });
      });

      const sourceControls = [];
      document.querySelectorAll(".ps-source-control").forEach((control) => {
        const trigger = control.querySelector(".ps-source-trigger");
        const panel = control.querySelector(".ps-source-panel");
        if (!trigger || !panel) return;
        trigger.setAttribute("aria-controls", panel.id);
        trigger.setAttribute("aria-expanded", "false");
        let pinned = false;
        let loaded = false;
        let loading = null;
        let leaveTimer = null;
        const cancelLeave = () => { if (leaveTimer) clearTimeout(leaveTimer); leaveTimer = null; };
        const placePanel = () => {
          if (panel.hidden) return;
          panel.classList.remove("align-end", "align-above");
          panel.style.insetInlineStart = "";
          panel.style.insetInlineEnd = "";
          const gutter = 12;
          if (panel.getBoundingClientRect().right > window.innerWidth - gutter) {
            panel.classList.add("align-end");
          }
          if (panel.getBoundingClientRect().left < gutter) {
            panel.style.insetInlineStart = `${gutter - control.getBoundingClientRect().left}px`;
            panel.style.insetInlineEnd = "auto";
          }
          const controlRect = control.getBoundingClientRect();
          const roomBelow = window.innerHeight - controlRect.bottom;
          const roomAbove = controlRect.top;
          if (panel.getBoundingClientRect().height > roomBelow && roomAbove > roomBelow) {
            panel.classList.add("align-above");
          }
        };
        const close = () => {
          cancelLeave();
          pinned = false;
          panel.hidden = true;
          trigger.setAttribute("aria-expanded", "false");
        };
        const show = () => {
          cancelLeave();
          sourceControls.forEach((other) => { if (other.control !== control) other.close(); });
          panel.hidden = false;
          trigger.setAttribute("aria-expanded", "true");
          placePanel();
          if (loaded) return Promise.resolve(true);
          if (loading) return loading;
          panel.textContent = "Loading sources…";
          loading = fetch(trigger.dataset.sourcePreview, { headers: { Accept: "text/html" } })
            .then((response) => { if (!response.ok) throw new Error("Source preview unavailable"); return response.text(); })
            .then((html) => { panel.innerHTML = html; loaded = true; placePanel(); return true; })
            .catch(() => {
              panel.textContent = "Preview unavailable. Open the full source trail.";
              const fullLink = document.createElement("a");
              fullLink.href = trigger.href;
              fullLink.textContent = "View all sources →";
              panel.append(fullLink);
              placePanel();
              return false;
            })
            .finally(() => { loading = null; });
          return loading;
        };
        const scheduleClose = () => {
          cancelLeave();
          if (!pinned) leaveTimer = setTimeout(() => {
            if (!control.contains(document.activeElement)) close();
          }, 250);
        };
        control.addEventListener("pointerenter", () => { void show(); });
        control.addEventListener("pointerleave", scheduleClose);
        trigger.addEventListener("focus", () => { void show(); });
        control.addEventListener("focusout", (event) => {
          if (!control.contains(event.relatedTarget)) scheduleClose();
        });
        window.addEventListener("resize", placePanel);
        trigger.addEventListener("click", async (event) => {
          event.preventDefault();
          if (pinned) { close(); return; }
          pinned = true;
          if (!(await show())) window.location.assign(trigger.href);
        });
        sourceControls.push({ control, trigger, panel, close });
      });
      const signalControls = [...document.querySelectorAll(".ps-signal-control")];
      signalControls.forEach((control) => {
        control.addEventListener("toggle", () => {
          if (control.open) signalControls.forEach((other) => { if (other !== control) other.open = false; });
        });
      });
      document.addEventListener("pointerdown", (event) => {
        sourceControls.forEach((item) => {
          if (!item.control.contains(event.target)) item.close();
        });
        if (!event.target.closest(".ps-signal-control")) {
          signalControls.forEach((control) => { control.open = false; });
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        sourceControls.forEach((item) => {
          if (!item.panel.hidden && item.panel.contains(document.activeElement)) item.trigger.focus();
          item.close();
        });
        signalControls.forEach((control) => {
          if (control.open && control.contains(document.activeElement)) control.querySelector("summary")?.focus();
          control.open = false;
        });
      });

      const relativeTimes = document.querySelectorAll("time[data-relative-time]");
      if (relativeTimes.length) {
        const formatter = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
        relativeTimes.forEach((element) => { element.dataset.exactTime = element.textContent; });
        const refreshTimes = () => {
          const now = Date.now();
          relativeTimes.forEach((element) => {
            const when = Date.parse(element.dateTime);
            if (!Number.isFinite(when)) return;
            const seconds = Math.floor((now - when) / 1000);
            // Exact UTC text stays visible for future times and older reports.
            if (seconds < 0 || seconds >= 30 * 86400) {
              element.textContent = element.dataset.exactTime;
              return;
            }
            if (seconds < 60) element.textContent = "Just now";
            else if (seconds < 3600) element.textContent = formatter.format(-Math.floor(seconds / 60), "minute");
            else if (seconds < 86400) element.textContent = formatter.format(-Math.floor(seconds / 3600), "hour");
            else element.textContent = formatter.format(-Math.floor(seconds / 86400), "day");
          });
        };
        refreshTimes();
        window.setInterval(refreshTimes, 60_000);
      }
    })();
  </script>
{% endblock %}
